<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mochi - Your Personal Assistant</title>
</head>
<body>
    <header class="site-header">
        <div class="logo">
            <a href="#">
                <div class="logo-icon"></div>
                <span class="logo-text">Mochi</span>
            </a>
        </div>

      

        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">
            <span class="hamburger"></span>
        </button>
    </header>

    <main>
        <section id="hero" class="hero-section">
            <div class="hero-container">
                <!-- Left Column: Title, Subtitle, CTA & Stats -->
                <div class="hero-content">
                    <h1 class="hero-title">Your Personal Cute Friend Assistant.</h1>
                    <p class="hero-subtitle">A intent understanding tool caller,which helps you to do small.</p>
                    
                    <div class="hero-cta">
                        <a href="https://github.com/grafikeaserc-design/Mochi" class="store-badge">
                            <span>Source Code on</span>
                            <strong>Github</strong>
                        </a>
                       <!-- <a href="#" class="store-badge">
                            <span>GET IT ON</span>
                            <strong>Google Play</strong>
                        </a>-->
                    </div>

                    <div class="hero-stats">
                        <div class="stats-number">TRY Mochi</div>
                        <div class="stats-text">He must be<br>waiting for you</div>
                        <div class="stats-avatars-card">
                            <div class="avatar-group">
                                Open app
                            </div>
                            <a href="https://grafikeaserc-design.github.io/Mochi/" class="arrow-btn" aria-label="Next">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Visual Graphic & Phone Mockup -->
                <div class="hero-visual">
                    <div class="purple-card-bg">
                        <!-- Decorative Star Burst -->
                        <div class="star-burst">
                            <svg viewBox="0 0 100 100" fill="currentColor"><path d="M50 0 L61 39 L100 50 L61 61 L50 100 L39 61 L0 50 L39 39 Z"/></svg>
                        </div>

                        <!-- Phone Mockup -->
                        <div class="phone-mockup">
                        </div>

                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
